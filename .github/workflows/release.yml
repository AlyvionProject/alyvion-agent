name: Build and Release Alyvion Agent

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  # ==========================================================
  # Linux
  # ==========================================================

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-cargo-

      - name: Build
        run: cargo build --release --locked

      - name: Prepare binary
        run: |
          mkdir -p release
          cp target/release/alyvion-agent release/alyvion-agent
          chmod +x release/alyvion-agent

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: alyvion-agent-linux-x86_64
          path: release/alyvion-agent
          if-no-files-found: error


  # ==========================================================
  # Windows
  # ==========================================================

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Prepare binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item `
            target/x86_64-pc-windows-msvc/release/alyvion-agent.exe `
            release/alyvion-agent.exe

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: alyvion-agent-windows-x86_64
          path: release/alyvion-agent.exe
          if-no-files-found: error


  # ==========================================================
  # GitHub Release
  # ==========================================================

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-linux
      - build-windows

    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v5
        with:
          name: alyvion-agent-linux-x86_64
          path: release

      - name: Download Windows binary
        uses: actions/download-artifact@v5
        with:
          name: alyvion-agent-windows-x86_64
          path: release

      - name: Show release files
        run: |
          ls -lah release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"

          gh release create "$TAG" \
            release/alyvion-agent \
            release/alyvion-agent.exe \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Alyvion Agent $TAG" \
            --generate-notes
