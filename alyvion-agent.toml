# Конфигурация агента Alyvion.
#
# Этот файл читается автоматически, если лежит рядом с рабочим каталогом
# запуска. Любое значение можно переопределить переменной окружения.

# Идентификатор узла. Пусто — берётся имя хоста.
agent_id = ""

core_url = "http://127.0.0.1:5050"

telemetry_interval_secs = 10
heartbeat_interval_secs = 15
events_interval_secs = 10

# Сколько последних строк журналов просматривать за один проход.
log_tail_lines = 200
max_processes = 300

# Куда складывать позиции чтения: закладки журнала Windows и позиции
# в файлах журналов Linux. Путь относительный — считается от рабочего
# каталога запуска.
#
# ВАЖНО ПРИ ЗАПУСКЕ. Если агент запускается из разных каталогов, позиция
# будет теряться между запусками, и хвост журнала прочитается заново.
# Core отбросит дубликаты по идентификатору, но события пройдут по сети
# повторно. Для службы Windows указывайте абсолютный путь:
#     state_dir = "C:\\ProgramData\\Alyvion\\state"
state_dir = "state"

# Включение означает, что агент начнёт менять систему: блокировать
# адреса, завершать процессы, отключать учётные записи. Это осознанное
# решение администратора узла, поэтому значение задаётся явно.
#
# Реализовано на обеих платформах:
#   Linux   — iptables, kill, usermod;
#   Windows — netsh advfirewall, taskkill, net user.
allow_response_actions = true

# Дополнительные файлы журналов для разбора.
# Формат строк — как у журнала аутентификации.
# Пример: extra_log_paths = ["/opt/app/security.log"]
extra_log_paths = []

[collectors]
# Источники событий Linux.
# Системный журнал systemd (SSH, sudo, сервисы).
journald = true
# Журнал аутентификации: /var/log/secure или /var/log/auth.log.
auth_log = true
# Журнал аудита ядра /var/log/audit/audit.log.
auditd = true

# Источники событий Windows. На Linux эти значения не действуют:
# журнала событий Windows там нет, и сборщик ничего не возвращает.
# Журнал событий Windows: Security, System, Application, PowerShell.
winevent = true
# Канал Sysmon. Требует отдельной установки Sysmon на узле: если его
# нет, опрос канала даёт ошибку «канал не найден» на каждом цикле.
sysmon = false

# События самого агента.
agent = true
