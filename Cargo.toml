[package]
name = "alyvion-agent"
version = "0.1.0"
edition = "2024"
description = "Агент Alyvion — сбор телеметрии и событий ИБ на защищаемом узле"

[dependencies]
# Транспорт до Core: gRPC поверх HTTP/2, один двунаправленный поток.
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Сбор состояния узла: ЦП, память, диски, сеть, процессы.
sysinfo = "0.32"

# Конфигурация и разбор журналов.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Время, журналирование, обработка ошибок, идентификаторы событий.
chrono = "0.4"
tracing = "0.1"
# env-filter нужен, чтобы уровень журналирования задавался переменной
# RUST_LOG без пересборки агента.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
quick-xml = "0.42.0"
encoding_rs = "0.8.41"

# ---------------------------------------------------------------------------
#  Зависимости только для Windows.
#
#  Вынесены в отдельную секцию target.'cfg(windows)', а не в общий список:
#  крейт windows при обычном подключении ломает сборку под Linux (его
#  модуль windows-future не компилируется вне Windows). Платформенная
#  секция гарантирует, что Linux-агент вообще не тянет эти зависимости.
# ---------------------------------------------------------------------------
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_EventLog",
    # GetOEMCP: определяет кодировку вывода консольных программ
    # (cp866 на русской Windows) — без неё русский текст в отчётах
    # реагирования превращался бы в мусор.
    "Win32_Globalization",
    # CREATE_NO_WINDOW: не показывать окно консоли при вызове
    # taskkill, netsh и других утилит из агента-службы.
    "Win32_System_Threading",
    "Win32_Security",
] }

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "3"
