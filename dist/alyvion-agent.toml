# Конфигурация агента Alyvion для Windows.
# Подготовлена сборкой build-windows.sh.
#
# Отличия от Linux-версии и их причина:
#   * allow_response_actions = false — реагирование на Windows пока не
#     реализовано (нужны Stop-Process, netsh, блокировка учётных записей);
#   * journald, auth_log, auditd = false — этих источников событий
#     на Windows не существует.
#
# Что работает: телеметрия узла, связь с Core, проверка канала.
#
# ОБЯЗАТЕЛЬНО ПОПРАВЬТЕ ПЕРЕД ЗАПУСКОМ:
#   core_url — адрес Core, доступный С ЭТОЙ машины. Значение по умолчанию
#   http://127.0.0.1:5050 годится, только если Core работает на этом же
#   узле. Для отдельного сервера укажите его адрес, например
#   core_url = "http://192.168.1.10:5050".
#   Порт 5050 — это порт приёма данных (gRPC), а НЕ веб-интерфейс (5080).
#   Если Core за межсетевым экраном, откройте на нём порт 5050.

# Конфигурация агента Alyvion.
#
# Этот файл читается автоматически, если лежит рядом с рабочим каталогом
# запуска. Любое значение можно переопределить переменной окружения.

# Идентификатор узла. Пусто — берётся имя хоста.
agent_id = ""

core_url = "http://127.0.0.1:5050"

telemetry_interval_secs = 10
heartbeat_interval_secs = 15
events_interval_secs = 10

# Сколько последних строк журналов просматривать за один проход.
log_tail_lines = 200
max_processes = 300

# ВЫКЛЮЧЕНО по умолчанию: включение означает, что агент начнёт менять
# систему (блокировать адреса, завершать процессы, блокировать учётные
# записи). Это осознанное решение администратора узла.
allow_response_actions = false

# Дополнительные файлы журналов для разбора.
# Формат строк — как у журнала аутентификации.
# Пример: extra_log_paths = ["/opt/app/security.log"]
extra_log_paths = []

[collectors]
# Системный журнал systemd (SSH, sudo, сервисы).
journald = false
# Журнал аутентификации: /var/log/secure или /var/log/auth.log.
auth_log = false
# Журнал аудита ядра /var/log/audit/audit.log.
auditd = false
# События самого агента.
agent = true
